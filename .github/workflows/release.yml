# Creates the "public preview" release (tag v1.0-preview) when the release-preview branch is pushed, or when run by hand.
# The package, its checksum and the release notes are read from the gh-pages branch, where the website keeps them.
name: Release preview
on:
  push:
    branches: [release-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Check the download against its checksum
        run: sha256sum -c OpenAct-preview-1.0.zip.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0-preview OpenAct-preview-1.0.zip OpenAct-preview-1.0.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0-preview OpenAct-preview-1.0.zip OpenAct-preview-1.0.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --target main --prerelease --title "OpenAct 1.0 (public preview)" --notes-file RELEASE-NOTES.txt
          fi
